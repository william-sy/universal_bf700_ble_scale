rules:
  # Bronze
  action-setup: {status: exempt, comment: No service actions.}
  appropriate-polling: {status: exempt, comment: Push-based; scale advertises when stepped on.}
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: {status: exempt, comment: No service actions.}
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: {status: exempt, comment: Scale sleeps; cannot be contacted at setup.}
  unique-config-entry: done
  # Silver
  action-exceptions: {status: exempt, comment: No service actions.}
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: {status: exempt, comment: Always available; value restored.}
  integration-owner: done
  log-when-unavailable: {status: exempt, comment: Device sleeps by design.}
  parallel-updates: done
  reauthentication-flow: {status: exempt, comment: No authentication.}
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: {status: exempt, comment: Bluetooth address is static.}
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: {status: exempt, comment: One device per entry.}
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: {status: exempt, comment: No user-facing exceptions.}
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: {status: exempt, comment: No repairable issues.}
  stale-devices: {status: exempt, comment: One device per entry.}
  # Platinum
  async-dependency: done
  inject-websession: {status: exempt, comment: No HTTP.}
  strict-typing: todo
